<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Fininsaat ERP — Giriş</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; max-width: 26rem; margin: 0 auto; padding: 1.5rem 1rem 2rem; background: #eef2f7; color: #111; }
    h1 { font-size: 1.35rem; margin: 0 0 0.35rem; color: #1e1b4b; font-weight: 800; }
    .lead { font-size: 0.92rem; color: #475569; margin: 0 0 1rem; line-height: 1.45; }
    .card { background: #fff; border-radius: 12px; padding: 1.2rem 1.15rem; margin-bottom: 0.85rem; box-shadow: 0 1px 4px rgba(15,23,42,.08); border: 1px solid #e2e8f0; }
    label { display: block; margin: 0.45rem 0 0.25rem; font-size: 0.88rem; font-weight: 600; color: #334155; }
    input, button { font: inherit; padding: 0.55rem 0.65rem; width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; }
    button.primary { margin-top: 0.65rem; cursor: pointer; background: #4f46e5; color: #fff; border-color: #4f46e5; font-weight: 600; }
    button.primary:hover { background: #4338ca; }
    button.secondary { margin-top: 0.45rem; cursor: pointer; background: #f8fafc; color: #334155; border-color: #cbd5e1; font-weight: 600; font-size: 0.88rem; }
    .err { color: #b91c1c; font-size: 0.86rem; margin-top: 0.45rem; }
    .ok { color: #15803d; font-size: 0.86rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.45rem 0.35rem; border-bottom: 1px solid #e2e8f0; }
    a.home { color: #4f46e5; font-weight: 600; text-decoration: none; font-size: 0.9rem; }
    .muted { font-size: 0.8rem; color: #64748b; margin-top: 0.35rem; line-height: 1.45; }
    .helpfoot { margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid #e2e8f0; font-size: 0.85rem; color: #64748b; text-align: center; line-height: 1.5; }
    .helpfoot a { color: #4f46e5; font-weight: 600; }
  </style>
</head>
<body>
  <script>window.__INSAAT_ERP_API_DEFAULT="";</script>

  <p style="margin:0 0 0.25rem"><a class="home" href="index.html">← Ana sayfa</a></p>
  <h1>Fininsaat ERP</h1>
  <p id="leadMain" class="lead">İş e-postanız ve şifrenizle giriş yapın.</p>

  <input type="hidden" id="apiBase" value="" />

  <div id="setupOnce" class="card" style="display:none">
    <strong style="color:#312e81;display:block;margin-bottom:0.35rem">Bağlantı adresi</strong>
    <p class="muted">FinSkor size bir adres verdiyse aynen yapıştırın (sonda / olmadan). Bilginiz yoksa aşağıdaki e-postadan yazın; size ayarlarız.</p>
    <label for="apiVisible">Adres</label>
    <input type="url" id="apiVisible" placeholder="https://..." autocomplete="url" />
    <button type="button" class="secondary" id="saveBase">Kaydet</button>
    <p id="setupMsg" class="err" style="min-height:1em"></p>
  </div>

  <div id="loginCard" class="card">
    <label for="email">E-posta</label>
    <input type="email" id="email" autocomplete="username" />
    <label for="sifre">Şifre</label>
    <input type="password" id="sifre" autocomplete="current-password" />
    <button type="button" class="primary" id="btnLogin">Giriş yap</button>
    <p id="loginErr" class="err"></p>
  </div>

  <div class="card" id="panel" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem">
      <strong style="color:#312e81">Şantiyeler</strong>
      <button type="button" class="secondary" id="btnOut">Çıkış</button>
    </div>
    <p id="loadErr" class="err"></p>
    <div id="tableWrap"></div>
  </div>

  <div class="helpfoot">
    Sorun mu var? <a href="mailto:info@finskor.tr?subject=Fininsaat%20ERP%20yard%C4%B1m">info@finskor.tr</a>
  </div>

  <script>
(function () {
  var K = "insaatErpToken";
  var B = "insaatErpApiBase";
  var HELP = " Sorun devam ederse info@finskor.tr adresine yazın.";

  function $id(id) { return document.getElementById(id); }
  function useNetlifyProxy() {
    var h = (location.hostname || "").toLowerCase();
    if (h === "finskor.tr" || h === "www.finskor.tr") return true;
    if (h.endsWith(".netlify.app")) return true;
    return false;
  }
  function apiUrl(rel) {
    var p = rel.indexOf("/") === 0 ? rel : "/" + rel;
    var b = (getBase() || "").replace(/\/+$/, "");
    if (b) return b + "/api/v1" + p;
    if (useNetlifyProxy()) {
      return "/.netlify/functions/insaat-erp-proxy?p=" + encodeURIComponent(p);
    }
    return b + "/api/v1" + p;
  }
  function getBase() { return ($id("apiBase").value || "").trim(); }
  function token() { return localStorage.getItem(K) || ""; }
  function hasApiBase() {
    if (useNetlifyProxy()) return true;
    return !!getBase().trim();
  }
  function friendlyErr(msg) {
    var m = (msg || "").trim();
    if (/INSAAT_ERP|Netlify|Environment variables/i.test(m)) {
      return "Bağlantı henüz hazır değil." + HELP;
    }
    return m || ("İşlem yapılamadı." + HELP);
  }

  function loadSant() {
    $id("loadErr").textContent = "Yükleniyor…";
    fetch(apiUrl("/santiyeler?limit=50"), {
      headers: { Authorization: "Bearer " + token() }
    }).then(function (r) { return r.json().then(function (j) { return { r: r, j: j }; }); })
    .then(function (x) {
      if (!x.r.ok) {
        $id("loadErr").textContent = friendlyErr(x.j && x.j.message) || "Liste alınamadı.";
        $id("tableWrap").innerHTML = "";
        return;
      }
      var rows = (x.j.data && x.j.data) || [];
      if (!Array.isArray(rows)) { $id("loadErr").textContent = "Liste okunamadı."; return; }
      $id("loadErr").textContent = rows.length + " şantiye";
      $id("loadErr").className = "ok";
      var h = "<table><thead><tr><th>Ad</th><th>İl</th><th>Durum</th></tr></thead><tbody>";
      for (var i = 0; i < rows.length; i++) {
        var s = rows[i];
        h += "<tr><td>" + esc(s.ad) + "</td><td>" + esc(s.il || "") + "</td><td>" + esc(s.durum || "") + "</td></tr>";
      }
      h += "</tbody></table>";
      $id("tableWrap").innerHTML = h;
    })
    .catch(function () { $id("loadErr").textContent = "İnternet bağlantınızı kontrol edin." + HELP; });
  }

  function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function refreshUI() {
    var base = getBase();
    var t = token();
    var proxy = useNetlifyProxy();
    if (t) {
      $id("setupOnce").style.display = "none";
      $id("loginCard").style.display = "none";
      $id("leadMain").style.display = "none";
      $id("panel").style.display = "block";
      loadSant();
      return;
    }
    $id("panel").style.display = "none";
    $id("leadMain").style.display = "block";
    if (proxy || base) {
      $id("setupOnce").style.display = "none";
      $id("loginCard").style.display = "block";
      $id("leadMain").textContent = "İş e-postanız ve şifrenizle giriş yapın.";
    } else {
      $id("setupOnce").style.display = "block";
      $id("loginCard").style.display = "block";
      $id("leadMain").textContent = "Önce üstteki kutuya bağlantı adresini yazıp Kaydet’e basın. Adres yoksa info@finskor.tr — yardım için yazın.";
    }
  }

  function applyJsonBase(j) {
    try {
      if (!j || typeof j.apiBase !== "string") return false;
      var u = j.apiBase.trim();
      if (!/^https?:\/\//i.test(u)) return false;
      localStorage.setItem(B, u);
      $id("apiBase").value = u;
      $id("apiVisible").value = u;
      return true;
    } catch (e) { return false; }
  }

  function wireEvents() {
    $id("saveBase").onclick = function () {
      var v = ($id("apiVisible").value || "").trim();
      $id("setupMsg").textContent = "";
      if (!v) { $id("setupMsg").textContent = "Lütfen adresi yazın."; $id("setupMsg").className = "err"; return; }
      localStorage.setItem(B, v);
      $id("apiBase").value = v;
      $id("setupMsg").textContent = "Kaydedildi. Şimdi giriş yapabilirsiniz.";
      $id("setupMsg").className = "ok";
      refreshUI();
    };

    $id("btnOut").onclick = function () { localStorage.removeItem(K); refreshUI(); };

    $id("btnLogin").onclick = function () {
      $id("loginErr").textContent = "";
      if (!hasApiBase()) {
        $id("loginErr").textContent = "Önce bağlantı adresini yazıp Kaydet’e basın." + HELP;
        $id("setupOnce").style.display = "block";
        return;
      }
      var body = { email: $id("email").value.trim(), sifre: $id("sifre").value };
      fetch(apiUrl("/auth/login"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      }).then(function (r) { return r.json().then(function (j) { return { r: r, j: j }; }); })
      .then(function (x) {
        var d = x.j && x.j.data;
        var tok = d && (d.token || d.accessToken);
        if (!x.r.ok || !x.j.success || !d || !tok) {
          $id("loginErr").textContent = friendlyErr(x.j && x.j.message);
          return;
        }
        localStorage.setItem(K, tok);
        refreshUI();
      })
      .catch(function () { $id("loginErr").textContent = "Şu an bağlanılamıyor." + HELP; });
    };
  }

  function boot() {
    var DEF = typeof window.__INSAAT_ERP_API_DEFAULT === "string" ? window.__INSAAT_ERP_API_DEFAULT.trim() : "";
    var stored = (localStorage.getItem(B) || "").trim();
    var resolved = DEF || stored;

    if (DEF) localStorage.setItem(B, DEF);

    if (stored && !DEF) $id("apiVisible").value = stored;
    if (resolved) $id("apiBase").value = resolved;

    wireEvents();

    function finish() {
      refreshUI();
    }

    if (!getBase()) {
      fetch("/insaat-erp-api.json", { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : {}; })
        .then(function (j) { applyJsonBase(j); })
        .catch(function () {})
        .then(finish);
    } else {
      finish();
    }
  }

  boot();
})();
  </script>
</body>
</html>
