<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Fininsaat ERP — Giriş</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; max-width: 42rem; margin: 0 auto; padding: 1rem 1rem 2rem; background: #eef2f7; color: #111; }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; color: #1e1b4b; }
    .lead { font-size: 0.92rem; color: #475569; margin: 0 0 1rem; line-height: 1.5; }
    .card { background: #fff; border-radius: 10px; padding: 1rem 1.1rem; margin-bottom: 0.85rem; box-shadow: 0 1px 4px rgba(15,23,42,.08); border: 1px solid #e2e8f0; }
    label { display: block; margin: 0.4rem 0 0.2rem; font-size: 0.88rem; font-weight: 600; color: #334155; }
    input, button { font: inherit; padding: 0.5rem 0.65rem; width: 100%; max-width: 100%; border: 1px solid #cbd5e1; border-radius: 6px; }
    button { margin-top: 0.5rem; max-width: 12rem; cursor: pointer; background: #4f46e5; color: #fff; border-color: #4f46e5; font-weight: 600; }
    button:hover { background: #4338ca; }
    button.secondary { background: #fff; color: #334155; border-color: #cbd5e1; }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .err { color: #b91c1c; font-size: 0.88rem; }
    .ok { color: #15803d; font-size: 0.88rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.45rem 0.35rem; border-bottom: 1px solid #e2e8f0; }
    code { font-size: 0.8rem; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Fininsaat ERP</h1>
  <p class="lead">
    <strong>1)</strong> Şirketinizin İnşaat ERP <strong>API adresini</strong> yazın (sonunda <code>/</code> olmasın; IT ekibinden isteyin).
    <strong>Kaydet</strong>’e basın — tarayıcı hatırlar.<br />
    <strong>2)</strong> <strong>Sağlık kontrolü</strong> ile bağlantıyı doğrulayın.<br />
    <strong>3)</strong> E-posta ve şifre ile <strong>Giriş yap</strong> — şantiye listesi açılır.
  </p>

  <div class="card">
    <strong style="display:block;margin-bottom:0.5rem;color:#312e81">API sunucusu</strong>
    <div class="row">
      <input type="url" id="apiBase" placeholder="https://erp-api.sirketiniz.com" value="" autocomplete="url" />
    </div>
    <div class="row" style="margin-top:0.6rem">
      <button type="button" class="secondary" id="saveBase">Kaydet</button>
      <button type="button" class="secondary" id="btnHealth">Bağlantıyı dene (/health)</button>
    </div>
    <p id="healthOut" class="err" style="margin-top:0.5rem;min-height:1.2em"></p>
  </div>

  <div class="card" id="loginBox">
    <strong style="display:block;margin-bottom:0.5rem;color:#312e81">Giriş</strong>
    <label>E-posta <input type="email" id="email" autocomplete="username" /></label>
    <label>Şifre <input type="password" id="sifre" autocomplete="current-password" /></label>
    <button type="button" id="btnLogin">Giriş yap</button>
    <p id="loginErr" class="err"></p>
  </div>

  <div class="card" id="panel" style="display:none">
    <div class="row" style="justify-content: space-between">
      <strong style="color:#312e81">Şantiyeler</strong>
      <button type="button" id="btnOut" class="secondary">Çıkış</button>
    </div>
    <p id="loadErr" class="err"></p>
    <div id="tableWrap"></div>
  </div>

  <script>
(function () {
  var K = "insaatErpToken";
  var B = "insaatErpApiBase";
  var DEF = typeof window.__INSAAT_ERP_API_DEFAULT === "string" ? window.__INSAAT_ERP_API_DEFAULT.trim() : "";

  function $id(id) { return document.getElementById(id); }
  function api(b, path) {
    var x = (b || "").replace(/\/+$/, "");
    return x + "/api/v1" + (path.indexOf("/") === 0 ? path : "/" + path);
  }
  function getBase() { return ($id("apiBase").value || "").trim(); }
  function token() { return localStorage.getItem(K) || ""; }

  if (DEF) $id("apiBase").placeholder = DEF;
  if (localStorage.getItem(B)) $id("apiBase").value = localStorage.getItem(B);
  else if (DEF && !$id("apiBase").value) $id("apiBase").value = DEF;

  $id("saveBase").onclick = function () {
    if (!getBase()) { $id("healthOut").textContent = "Önce API adresi yazın."; $id("healthOut").className = "err"; return; }
    localStorage.setItem(B, getBase());
    $id("healthOut").textContent = "Kaydedildi.";
    $id("healthOut").className = "ok";
  };

  $id("btnHealth").onclick = function () {
    if (!getBase()) { $id("healthOut").textContent = "Önce API adresi yazın."; $id("healthOut").className = "err"; return; }
    var u = getBase().replace(/\/+$/, "") + "/health";
    $id("healthOut").textContent = "Kontrol ediliyor…";
    $id("healthOut").className = "";
    fetch(u).then(function (r) { return r.text(); })
      .then(function (t) { $id("healthOut").textContent = t.slice(0, 200); $id("healthOut").className = "ok"; })
      .catch(function (e) { $id("healthOut").textContent = "Ulaşılamadı: " + e; $id("healthOut").className = "err"; });
  };

  function showPanel() {
    $id("loginBox").style.display = token() ? "none" : "block";
    $id("panel").style.display = token() ? "block" : "none";
    if (token()) loadSant();
  }
  $id("btnOut").onclick = function () { localStorage.removeItem(K); showPanel(); };

  $id("btnLogin").onclick = function () {
    $id("loginErr").textContent = "";
    if (!getBase()) { $id("loginErr").textContent = "Önce API adresini yazıp Kaydet’e basın."; return; }
    var body = { email: $id("email").value.trim(), sifre: $id("sifre").value };
    fetch(api(getBase(), "/auth/login"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json().then(function (j) { return { r: r, j: j }; }); })
    .then(function (x) {
      if (!x.r.ok || !x.j.success || !x.j.data || !x.j.data.token) {
        $id("loginErr").textContent = (x.j && x.j.message) || "Giriş başarısız — adres ve şifreyi kontrol edin.";
        return;
      }
      localStorage.setItem(K, x.j.data.token);
      showPanel();
    })
    .catch(function (e) { $id("loginErr").textContent = "Bağlantı hatası: " + e; });
  };

  function loadSant() {
    $id("loadErr").textContent = "Yükleniyor…";
    fetch(api(getBase(), "/santiyeler?limit=50"), {
      headers: { Authorization: "Bearer " + token() }
    }).then(function (r) { return r.json().then(function (j) { return { r: r, j: j }; }); })
    .then(function (x) {
      if (!x.r.ok) { $id("loadErr").textContent = (x.j && x.j.message) || "Liste alınamadı"; $id("tableWrap").innerHTML = ""; return; }
      var rows = (x.j.data && x.j.data) || [];
      if (!Array.isArray(rows)) { $id("loadErr").textContent = "Beklenmeyen cevap"; return; }
      $id("loadErr").textContent = rows.length + " şantiye";
      $id("loadErr").className = "ok";
      var h = "<table><thead><tr><th>Ad</th><th>İl</th><th>Durum</th></tr></thead><tbody>";
      for (var i = 0; i < rows.length; i++) {
        var s = rows[i];
        h += "<tr><td>" + esc(s.ad) + "</td><td>" + esc(s.il || "") + "</td><td>" + esc(s.durum || "") + "</td></tr>";
      }
      h += "</tbody></table>";
      $id("tableWrap").innerHTML = h;
    })
    .catch(function (e) { $id("loadErr").textContent = String(e); });
  }
  function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  showPanel();
})();
  </script>
</body>
</html>
