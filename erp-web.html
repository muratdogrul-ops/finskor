<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Fininsaat ERP — Giriş</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; max-width: 28rem; margin: 0 auto; padding: 1.5rem 1rem 2rem; background: #eef2f7; color: #111; }
    h1 { font-size: 1.35rem; margin: 0 0 0.35rem; color: #1e1b4b; font-weight: 800; }
    .lead { font-size: 0.95rem; color: #475569; margin: 0 0 1.25rem; line-height: 1.45; }
    .card { background: #fff; border-radius: 12px; padding: 1.25rem 1.2rem; margin-bottom: 0.85rem; box-shadow: 0 1px 4px rgba(15,23,42,.08); border: 1px solid #e2e8f0; }
    label { display: block; margin: 0.45rem 0 0.25rem; font-size: 0.88rem; font-weight: 600; color: #334155; }
    input, button { font: inherit; padding: 0.55rem 0.65rem; width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; }
    button.primary { margin-top: 0.75rem; cursor: pointer; background: #4f46e5; color: #fff; border-color: #4f46e5; font-weight: 600; }
    button.primary:hover { background: #4338ca; }
    button.secondary { margin-top: 0.5rem; cursor: pointer; background: #fff; color: #475569; border-color: #cbd5e1; font-weight: 500; font-size: 0.85rem; }
    .err { color: #b91c1c; font-size: 0.88rem; margin-top: 0.5rem; }
    .ok { color: #15803d; font-size: 0.88rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.45rem 0.35rem; border-bottom: 1px solid #e2e8f0; }
    a.home { color: #4f46e5; font-weight: 600; text-decoration: none; }
    a.home:hover { text-decoration: underline; }
    #advanced { display: none; margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed #cbd5e1; font-size: 0.82rem; color: #64748b; }
    #advanced input { margin-top: 0.35rem; }
  </style>
</head>
<body>
  <!-- Netlify build: INSAAT_ERP_API_URL → patchInsaatErpApiDefault -->
  <script>window.__INSAAT_ERP_API_DEFAULT="";</script>

  <h1>Fininsaat ERP</h1>
  <p id="leadLogin" class="lead" style="display:none">Kurumsal hesabınızla giriş yapın.</p>

  <div id="blockWait" class="card" style="display:none">
    <p style="margin:0;line-height:1.55;color:#334155;font-size:0.95rem">
      Bu giriş şu an sizin için açılmadı veya kurulum sürüyor. Bir süre sonra yeniden deneyin ya da FinSkor ile iletişime geçin.
    </p>
    <p style="margin:1rem 0 0"><a class="home" href="index.html">← Ana sayfaya dön</a></p>
  </div>

  <div id="blockLogin" style="display:none">
    <input type="hidden" id="apiBase" value="" />
    <div class="card">
      <label for="email">E-posta</label>
      <input type="email" id="email" autocomplete="username" />
      <label for="sifre">Şifre</label>
      <input type="password" id="sifre" autocomplete="current-password" />
      <button type="button" class="primary" id="btnLogin">Giriş yap</button>
      <p id="loginErr" class="err"></p>
    </div>
    <p style="text-align:center;margin-top:0.75rem">
      <button type="button" class="secondary" id="btnAdvanced">Bağlantı sorunu · teknik ayar</button>
    </p>
    <div id="advanced">
      <p style="margin:0 0 0.5rem">Yalnızca IT / yazılım için — sunucu adresi (sonunda / olmasın):</p>
      <input type="url" id="apiVisible" placeholder="" autocomplete="url" />
      <button type="button" class="secondary" id="saveBase">Kaydet ve yenile</button>
      <p id="setupHint" class="err" style="min-height:1em;margin-top:0.35rem"></p>
    </div>
  </div>

  <div class="card" id="panel" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem">
      <strong style="color:#312e81">Şantiyeler</strong>
      <button type="button" class="secondary" id="btnOut">Çıkış</button>
    </div>
    <p id="loadErr" class="err"></p>
    <div id="tableWrap"></div>
  </div>

  <script>
(function () {
  var K = "insaatErpToken";
  var B = "insaatErpApiBase";
  var DEF = typeof window.__INSAAT_ERP_API_DEFAULT === "string" ? window.__INSAAT_ERP_API_DEFAULT.trim() : "";

  function $id(id) { return document.getElementById(id); }
  function api(b, path) {
    var x = (b || "").replace(/\/+$/, "");
    return x + "/api/v1" + (path.indexOf("/") === 0 ? path : "/" + path);
  }
  function getBase() { return ($id("apiBase").value || "").trim(); }
  function token() { return localStorage.getItem(K) || ""; }

  var stored = (localStorage.getItem(B) || "").trim();
  var resolved = DEF || stored;

  if (DEF) localStorage.setItem(B, DEF);

  if (!resolved) {
    $id("blockWait").style.display = "block";
    return;
  }

  $id("apiBase").value = resolved;
  $id("leadLogin").style.display = "block";
  $id("blockLogin").style.display = "block";

  $id("btnAdvanced").onclick = function () {
    var a = $id("advanced");
    a.style.display = a.style.display === "block" ? "none" : "block";
    $id("apiVisible").value = getBase();
  };
  $id("saveBase").onclick = function () {
    var v = ($id("apiVisible").value || "").trim();
    if (!v) { $id("setupHint").textContent = "Adres yazın."; return; }
    localStorage.setItem(B, v);
    location.reload();
  };

  function showPanel() {
    $id("blockLogin").style.display = token() ? "none" : "block";
    $id("leadLogin").style.display = token() ? "none" : "block";
    $id("panel").style.display = token() ? "block" : "none";
    if (token()) loadSant();
  }
  $id("btnOut").onclick = function () { localStorage.removeItem(K); showPanel(); };

  $id("btnLogin").onclick = function () {
    $id("loginErr").textContent = "";
    var body = { email: $id("email").value.trim(), sifre: $id("sifre").value };
    fetch(api(getBase(), "/auth/login"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json().then(function (j) { return { r: r, j: j }; }); })
    .then(function (x) {
      if (!x.r.ok || !x.j.success || !x.j.data || !x.j.data.token) {
        $id("loginErr").textContent = (x.j && x.j.message) || "Giriş yapılamadı. E-posta ve şifreyi kontrol edin.";
        return;
      }
      localStorage.setItem(K, x.j.data.token);
      showPanel();
    })
    .catch(function () { $id("loginErr").textContent = "Şu an bağlanılamıyor. Daha sonra deneyin."; });
  };

  function loadSant() {
    $id("loadErr").textContent = "Yükleniyor…";
    fetch(api(getBase(), "/santiyeler?limit=50"), {
      headers: { Authorization: "Bearer " + token() }
    }).then(function (r) { return r.json().then(function (j) { return { r: r, j: j }; }); })
    .then(function (x) {
      if (!x.r.ok) { $id("loadErr").textContent = (x.j && x.j.message) || "Liste alınamadı"; $id("tableWrap").innerHTML = ""; return; }
      var rows = (x.j.data && x.j.data) || [];
      if (!Array.isArray(rows)) { $id("loadErr").textContent = "Yanıt beklenenden farklı"; return; }
      $id("loadErr").textContent = rows.length + " şantiye";
      $id("loadErr").className = "ok";
      var h = "<table><thead><tr><th>Ad</th><th>İl</th><th>Durum</th></tr></thead><tbody>";
      for (var i = 0; i < rows.length; i++) {
        var s = rows[i];
        h += "<tr><td>" + esc(s.ad) + "</td><td>" + esc(s.il || "") + "</td><td>" + esc(s.durum || "") + "</td></tr>";
      }
      h += "</tbody></table>";
      $id("tableWrap").innerHTML = h;
    })
    .catch(function (e) { $id("loadErr").textContent = "Bağlantı sorunu."; });
  }
  function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  showPanel();
})();
  </script>
</body>
</html>
