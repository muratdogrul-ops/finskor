# Yerel FinSkor + İnşaat ERP API + PostgreSQL
# Kullanım: insaat-erp klasöründe .env oluştur (.env.example kopyası), sonra:
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-erp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-insaat_erp}
    ports:
      - "${DB_PUBLISH_PORT:-5432}:5432"
    volumes:
      - insaat_erp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erp_user} -d ${DB_NAME:-insaat_erp}"]
      interval: 3s
      timeout: 5s
      retries: 8
      start_period: 10s

  api:
    build:
      context: ./insaat-erp-backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      NODE_ENV: production
      # Tarayıcı / Netlify proxy / Vite — virgülle (compose .env içinden genişletilebilir)
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,https://finskor.tr,https://www.finskor.tr}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  insaat_erp_pg: {}
